<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Check-In Portal | Raas Leela 2026</title>
  <meta http-equiv="refresh" content="0; url=index.html#staff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090305;
      color: #fdfbf7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      background: rgba(26, 12, 16, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .shield-badge {
      width: 56px;
      height: 56px;
      color: #d4af37;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 8px;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn-enter {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #d4af37, #aa8010);
      color: #0d0407;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
    }
  </style>
  <script>
    window.location.replace("index.html#staff");
  </script>
</head>
<body>
  <div class="redirect-card">
    <svg class="shield-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <h1>Staff Check-In</h1>
    <p>Loading authorized gate check-in scanner and credential verification...</p>
    <a href="index.html#staff" class="btn-enter">Open Staff Portal</a>
  </div>
</body>
</html>
