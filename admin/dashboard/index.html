<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard Security | Raas Leela 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090305;
      color: #fdfbf7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .security-guard-card {
      background: rgba(26, 12, 16, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .lock-icon {
      width: 56px;
      height: 56px;
      color: #ef4444;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ef4444;
      margin-bottom: 8px;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn-login {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #d4af37, #aa8010);
      color: #0d0407;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
    }
  </style>
  <script>
    (function() {
      var hasSession = !!sessionStorage.getItem('raas_admin_session');
      if (hasSession) {
        // Authenticated: forward to command center
        window.location.replace("../../index.html#admin");
      } else {
        // Unauthenticated: redirect to login after brief security notification
        setTimeout(function() {
          window.location.replace("../../index.html#admin");
        }, 1200);
      }
    })();
  </script>
</head>
<body>
  <div class="security-guard-card">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h1>ACCESS DENIED</h1>
    <p>Authentication required to access the Raas Leela Admin Command Center. Redirecting to secure login...</p>
    <a href="../../index.html#admin" class="btn-login">Go to Admin Login</a>
  </div>
</body>
</html>
